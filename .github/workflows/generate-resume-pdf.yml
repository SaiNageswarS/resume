name: Generate Resume PDF

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-pdf:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Install LaTeX packages
      run: |
        sudo apt-get update
        sudo apt-get install -y texlive-latex-base texlive-fonts-recommended texlive-latex-extra texlive-fonts-extra
        
    - name: Generate PDF from LaTeX
      run: |
        pdflatex resume.tex
        # Run twice to resolve cross-references
        pdflatex resume.tex
        
    - name: Upload PDF artifact (backup)
      uses: actions/upload-artifact@v4
      with:
        name: resume-pdf-${{ github.run_number }}
        path: resume.pdf
        retention-days: 90
        
    - name: Commit and push PDF to repository
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add resume.pdf
        git diff --staged --quiet || git commit -m "Auto-generate resume PDF - Build ${{ github.run_number }}"
        git push